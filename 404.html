<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>404 · Page Not Found · Craft Kombucha</title>
  <link rel="icon" type="image/jpeg" href="images/hero 1.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f0f9f4;
      --text-primary: #1b4332;
      --text-secondary: #5a7a68;
      --text-light: #94b3a3;
      --border-color: #d8ebe0;
      --accent: #2d6a4f;
      --accent-light: #52b788;
      --accent-dark: #1b4332;
      --accent-soft: #e6f4ea;
      --highlight: #f59e0b;
      --highlight-dark: #d97706;
      --shadow: rgba(27, 67, 50, 0.08);
      --transition: 0.3s ease;
    }

    [data-theme="dark"] {
      --bg-primary: #0d1f17;
      --bg-secondary: #0a1810;
      --text-primary: #e8f5ec;
      --text-secondary: #9dbfa9;
      --text-light: #5a7a68;
      --border-color: #1c3326;
      --shadow: rgba(0, 0, 0, 0.6);
      --accent-soft: #14291d;
    }

    [dir="rtl"] { text-align: right; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    /* ===== 404 CONTENT ===== */
    .error-section {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .error-content {
      text-align: center;
      max-width: 720px;
      position: relative;
      z-index: 1;
      margin: 0 auto;
    }

    /* Big 404 number */
    .error-number {
      font-size: 12rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.1em;
      user-select: none;
    }
    .error-number .digit-4 {
      color: var(--accent-dark);
      position: relative;
    }
    [data-theme="dark"] .error-number .digit-4 { color: var(--accent-light); }
    .error-number .digit-0 {
      color: var(--highlight);
      position: relative;
      display: inline-block;
    }

    /* Title with two-tone */
    .error-title {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.5px;
      margin-bottom: 1.2rem;
      color: var(--accent-dark);
    }
    [data-theme="dark"] .error-title { color: var(--text-primary); }
    .error-title span {
      color: var(--highlight);
      display: inline-block;
    }

    .error-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.75;
      max-width: 560px;
      margin: 0 auto 2.5rem;
    }

    /* Single button */
    .error-btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.95rem 2.4rem;
      border-radius: 60px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .error-btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(45, 106, 79, 0.35);
    }
    .error-btn-primary i { transition: transform 0.25s; }
    .error-btn-primary:hover i { transform: translateX(-4px); }
    [dir="rtl"] .error-btn-primary:hover i { transform: translateX(4px); }

    /* Responsive */
    @media (max-width: 1024px) {
      .error-number { font-size: 9rem; }
      .error-title { font-size: 2rem; }
    }
    @media (max-width: 767px) {
      body { padding: 1.5rem 1rem; }
      .error-number { font-size: 7rem; margin-bottom: 1rem; }
      .error-title { font-size: 1.6rem; margin-bottom: 1rem; }
      .error-desc { font-size: 0.92rem; margin-bottom: 2rem; }
      .error-btn-primary { width: 100%; max-width: 280px; justify-content: center; }
    }
    @media (max-width: 480px) {
      .error-number { font-size: 5.5rem; }
      .error-title { font-size: 1.3rem; }
      .error-desc { font-size: 0.85rem; }
      .error-btn-primary { padding: 0.75rem 1.6rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <!-- ===== 404 CONTENT ===== -->
  <section class="error-section">
    <div class="error-content">

      <!-- Big 404 -->
      <div class="error-number">
        <span class="digit-4">4</span>
        <span class="digit-0">0</span>
        <span class="digit-4">4</span>
      </div>

      <!-- Title -->
      <h1 class="error-title">
        This Page <span>Drifted Off The Brew</span>
      </h1>

      <!-- Description -->
      <p class="error-desc">
        Oops! The page you're looking for doesn't exist anymore — or may have been moved to a new tap. Let's get you back to something worth sipping.
      </p>

      <!-- Single button -->
      <a href="index.html" class="error-btn-primary">
        <i class="fas fa-arrow-left"></i> Back To Home
      </a>
    </div>
  </section>
</body>
</html>
